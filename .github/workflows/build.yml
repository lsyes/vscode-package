name: build

# Packaging-only workflow.
#
# GitHub does not host LoongArch runners, so the architecture specific payloads
# (native addons, ripgrep and the four standalone helpers: code-tunnel,
# copilot-shim, apply-seccomp, vsce-sign) are built separately and uploaded
# BY HAND as one asset of the `loong64-prebuilts` release:
#
#   dist/loong64-prebuilts-<version>-electron<electron>-loong64.tar.gz
#
# This workflow then downloads that asset, stages it, verifies the result and
# writes the `.deb` on a plain ubuntu-latest runner.  No compiler is installed,
# so a missing or stale payload fails loudly instead of silently degrading.
#
# The optional `payloads` job reproduces the bundle on a self-hosted LoongArch
# runner; it is disabled unless `build_payloads` is ticked.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version (blank = take it from the bundle asset)'
        required: false
        default: ''
      bundle:
        description: 'Bundle asset name or URL (blank = newest for the version)'
        required: false
        default: ''
      publish:
        description: 'Publish a GitHub release'
        type: boolean
        default: true
      build_payloads:
        description: 'Also rebuild the payload bundle (needs a self-hosted loong64 runner)'
        type: boolean
        default: false
  push:
    branches:
      - master
    tags:
      - 'v*-loong64'
  schedule:
    # weekly packaging check of the newest uploaded bundle, Mondays 04:17 UTC
    - cron: '17 4 * * 1'
    - cron: '41 2 * * *'

permissions:
  contents: write

concurrency:
  group: build-loong64
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  BUNDLE_TAG: loong64-prebuilts

jobs:
  # ---------------------------------------------------------------------------
  # fast checks that need no toolchain
  # ---------------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the builder
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Unit checks
        run: |
          . .venv/bin/activate
          make check

  # ---------------------------------------------------------------------------
  # optional: rebuild the payload bundle on a LoongArch host
  # ---------------------------------------------------------------------------
  payloads:
    needs: check
    if: ${{ inputs.build_payloads }}
    runs-on: [self-hosted, linux, loong64]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Show host
        run: uname -a && nproc

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils git make curl ca-certificates \
            python3 python3-pip python3-venv pkg-config zstd xz-utils

      - name: Install Rust targets
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          . "$HOME/.cargo/env"
          rustup target add loongarch64-unknown-linux-gnu loongarch64-unknown-linux-musl
          rustc --version

      - name: Install the builder
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Restore payload caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/prebuilts
            .cache/sources
            .cache/cargo
            .cache/dotnet
            .cache/tools
          key: payloads-${{ runner.os }}-${{ hashFiles('src/vscode_loong64/**', 'src-tools/**') }}
          restore-keys: |
            payloads-

      - name: Build the payload bundle
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          . .venv/bin/activate
          make bundle VERSION="${REQUESTED:-latest}"

      - name: Upload the bundle by hand
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(dist/loong64-prebuilts-*.tar.gz)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo 'no bundle was produced' >&2
            exit 1
          fi
          # the asset is what the packaging job consumes; publishing it needs a
          # separate decision, so it is attached to the job summary only
          {
            echo '## Payload bundle'
            echo
            echo 'Upload this file as an asset of the `loong64-prebuilts` release:'
            echo
            echo '```'
            echo "${bundles[0]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: loong64-prebuilts
          path: dist/loong64-prebuilts-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # packaging: runs on x86-64, never installs a compiler
  # ---------------------------------------------------------------------------
  package:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils dpkg-dev fakeroot xz-utils zstd ca-certificates curl
          # deliberately no compiler: a missing payload must fail loudly

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the builder
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Fetch the uploaded payload bundle
        id: bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPLICIT: ${{ inputs.bundle }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          . .venv/bin/activate
          mkdir -p dist
          if [ -n "${EXPLICIT}" ]; then
            case "${EXPLICIT}" in
              http*|https*)
                name=$(basename "${EXPLICIT}")
                curl -fL --retry 3 -o "dist/${name}" "${EXPLICIT}"
                ;;
              *)
                # the bundle may be attached to the dedicated release or to a
                # version release; try the bundle release first, then anything
                gh release download "$BUNDLE_TAG" -p "${EXPLICIT}" \
                  -O "dist/${EXPLICIT}" --clobber 2>/dev/null \
                  || gh release download -p "${EXPLICIT}" \
                     -O "dist/${EXPLICIT}" --clobber
                ;;
            esac
            archive=$(ls dist/loong64-prebuilts-*.tar.gz | head -1)
          else
            # newest bundle asset for the requested version (or overall); the
            # lookup walks every release, because the bundle is uploaded by hand
            args=(--repo "$GITHUB_REPOSITORY" --dest dist)
            if [ -n "${REQUESTED}" ]; then
              args+=(--version "${REQUESTED}")
            fi
            python -m vscode_loong64.cli prebuilts fetch "${args[@]}" > fetch.json
            archive=$(python -c 'import json; print(json.load(open("fetch.json"))["archive"])')
          fi
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          python -m vscode_loong64.cli prebuilts inspect "${archive}" > bundle.json
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          data = json.load(open("bundle.json"))
          print("## Payload bundle")
          print()
          print(f"- VSCode `{data['vscode']}` / Electron `{data['electron']}` / `{data['arch']}`")
          print(f"- {len(data['entries'])} payloads, schema {data['schema']}")
          PY

      - name: Package the Debian build
        env:
          VERSION: ${{ inputs.version }}
          BUNDLE: ${{ steps.bundle.outputs.archive }}
        run: |
          set -euo pipefail
          . .venv/bin/activate
          # the bundle pins the upstream version; the input only overrides it
          if [ -z "${VERSION}" ]; then
            VERSION=$(python -c 'import json; print(json.load(open("bundle.json"))["vscode"])')
          fi
          make deb-from-bundle VERSION="$VERSION" BUNDLE="$BUNDLE"

      - name: Check the manifest and the package
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python - <<'PY'
          import json
          import sys

          manifest = json.load(open("dist/manifest.json"))
          print("version:", manifest["vscode"]["version"], manifest["vscode"]["commit"][:8])
          print("bundle:", manifest.get("prebuiltBundleInput"))
          for helper in manifest["nativeModules"].get("helpers", []):
              print("helper:", helper["name"], helper["status"], helper.get("arch", ""))
          print("pruned from node_modules.asar:",
                manifest["nativeModules"].get("asarRemoved", []))
          failed = [check["name"] for check in manifest["checks"] if not check["ok"]]
          print("failed checks:", failed)
          if failed:
              sys.exit(1)
          PY
          deb=$(ls dist/*.deb)
          test "$(dpkg-deb -f "$deb" Architecture)" = loong64
          dpkg-deb -c "$deb" | grep -q './usr/share/code/bin/code-tunnel$'
          dpkg-deb -c "$deb" | grep -q './usr/share/code/bin/copilot-shim/copilot$'
          dpkg-deb -c "$deb" | grep -q 'vendor/seccomp/loong64/apply-seccomp$'
          dpkg-deb -c "$deb" | grep -q 'vsce-sign/bin/vsce-sign$'

      - uses: actions/upload-artifact@v4
        with:
          name: code-loong64
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish
        if: inputs.publish || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . .venv/bin/activate
          make publish REPO="${GITHUB_REPOSITORY}"
